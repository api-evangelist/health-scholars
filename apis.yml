aid: health-scholars
name: Health Scholars
description: >-
  Health Scholars — which rebranded to UpSkillAI in 2025 and now trades at upskillai.com — builds
  AI-powered extended reality (XR/VR) simulation training for mission-critical, hands-on work in
  healthcare, emergency medical services, stroke assessment and defense. The platform pairs
  voice-driven VR simulations with simulation management and readiness reporting, letting hospital
  systems, first responders and government programs run standardized protocol training on headsets
  without instructors or extra equipment. Customers reach it through a hosted web console at
  app.upskillai.com. The company publishes no public developer program: there is no developer portal,
  API reference, OpenAPI or other machine-readable contract, SDK, webhook catalog or public pricing.
  The production backend behind its own application (api.upskillai.com, with the legacy AWS API
  Gateway host api.healthscholars.com) is private and rejects unauthenticated requests.
